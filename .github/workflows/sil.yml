name: SIL regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sil:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends octave
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r sil/requirements.txt
      - name: Generated C vs Simulink model
        run: make -C sil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sil-report
          path: sil/out/
